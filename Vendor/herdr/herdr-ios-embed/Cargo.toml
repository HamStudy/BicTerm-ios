[package]
name = "herdr-ios-embed"
version = "0.9.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/herdrdev/herdr"
description = "In-process C ABI that runs the real herdr TUI client against a host-owned socketpair (Apple platforms)"
build = false

# Standalone workspace on purpose: this crate depends on the PATCHED herdr
# working copy that scripts/herdr-embed-prepare.sh materializes at
# ../../../.build-artifacts/herdr-embed (T1's patch series + T2's real
# libghostty-vt.a). The Vendor/herdr workspace excludes this directory so the
# stock herdr-ios-ffi builds never require the working copy to exist.
[lib]
crate-type = ["lib", "staticlib"]
name = "herdr_ios_embed"

[dependencies]
# features = ["bicterm-embed"]: this crate IS the embedded frontend, so the
# patched herdr client surfaces loop failures through run_client's Result
# instead of std::process::exit (embed patch 0005) unconditionally here.
herdr = { path = "../../../.build-artifacts/herdr-embed", features = ["bicterm-embed"] }
libc = "0.2"

[features]
# Forwards to the patched herdr crate's host-injected transport seam (T5).
bicterm-transport = ["herdr/bicterm-transport"]

# Release keeps full DWARF and stays LTO-free so herdr-embed-core.sh can
# archive a dSYM for crash symbolication (plan herdr-embed T8); rustc's
# LLVM bitcode is newer than Apple's linker/nm readers (same rationale as
# Vendor/herdr's ios-release profile).
[profile.release]
lto = false
debug = 2
strip = "none"

# The patched herdr crate redirects its portable-pty dependency to its own
# vendored copy; patches only apply from the workspace root, which this
# standalone crate is, so the redirect must be repeated here.
[patch.crates-io]
portable-pty = { path = "../../../.build-artifacts/herdr-embed/vendor/portable-pty" }

# Workspace lints of Vendor/herdr do not reach this standalone crate; the
# same override rationale as herdr-ios-ffi applies: this crate IS the audited
# FFI boundary and carries its reviewed `unsafe` blocks.
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"
non_camel_case_types = "allow"
non_snake_case = "allow"
