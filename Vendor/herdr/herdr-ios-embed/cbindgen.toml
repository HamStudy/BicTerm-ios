language = "C"
include_guard = "HERDR_EMBED_H"
autogen_warning = "/* Generated by cbindgen. Do not modify; regenerate via scripts/herdr-embed-prepare.sh (embed FFI build proof step). */"
documentation = true
usize_is_size_t = true

[export]
# Only the deliberately small ABI surface ships in the header.
item_types = ["constants", "globals", "structs", "enums", "functions", "typedefs"]
