[workspace]
resolver = "3"
members = ["herdr-protocol", "herdr-client-core", "herdr-ios-ffi"]
exclude = ["upstream", "herdr-ios-embed"]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/herdrdev/herdr"

[workspace.dependencies]
bincode = { version = "=2.0.1", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1

# iOS artifact profile: keeps unwind for catch_unwind-based FFI containment
# and full DWARF for the archived dSYM. LTO is disabled because rustc's LLVM
# bitcode is newer than Apple's linker/nm readers and they reject the archive.
[profile.ios-release]
inherits = "release"
lto = false
debug = 2
strip = "none"
