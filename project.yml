name: BicTerm
options:
  bundleIdPrefix: com.bicterm
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  AppStore-Debug: debug
  AppStore-Release: release
packages:
  BicTermCore:
    path: ./BicTermCore
  SwiftTerm:
    path: ./Vendor/SwiftTerm
targets:
  CoderTunnel:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CoderTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bicterm.CoderTunnel
        PRODUCT_MODULE_NAME: CoderTunnel
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Static archive: BicTermCore must resolve ONCE in the app image —
        # a dylib copy would split protocol identity (witness-table copy).
        MACH_O_TYPE: staticlib
    dependencies:
      - package: BicTermCore
        product: BicTermCore
      - framework: .build-artifacts/coder-net/CoderNet.xcframework
        embed: false
  BicTerm:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BicTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bicterm.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: "0x0D1117"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CODER_TUNNEL"
          # -lresolv: Go cgo DNS resolver (_res_9_ninit/_res_9_nclose).
          # -u _CoderNetVersion: forces the archiver to extract the Go bridge
          # object into the final link regardless of Swift-side DCE of the
          # CoderNetTunnel metatype touch. NOT -force_load/-all_load: Xcode
          # merges the SwiftPM product objects into CoderTunnel.a, and
          # wholesale extraction double-defines BicTermCore/NIO symbols.
          OTHER_LDFLAGS: "$(inherited) -framework CoderTunnel -lresolv -u _CoderNetVersion"
          FRAMEWORK_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CODER_TUNNEL"
          OTHER_LDFLAGS: "$(inherited) -framework CoderTunnel -lresolv -u _CoderNetVersion"
          FRAMEWORK_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)"
    dependencies:
      - package: BicTermCore
        product: BicTermCore
      - package: SwiftTerm
        product: SwiftTerm
  BicTermUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BicTermUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CODER_TUNNEL"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CODER_TUNNEL"
    dependencies:
      - target: BicTerm
  BicTermTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BicTermTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CODER_TUNNEL"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CODER_TUNNEL"
    dependencies:
      - target: BicTerm
schemes:
  BicTerm:
    build:
      # CoderTunnel has no target-dependency edge from the app (the AppStore
      # flavor must not even build it); schemes list it before the app, and
      # default-config OTHER_LDFLAGS/force_load do the linking.
      targets:
        CoderTunnel: all
        BicTerm: all
        BicTermUITests:
          - test
        BicTermTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BicTermUITests
        - BicTermTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BicTerm-AppStore:
    build:
      targets:
        BicTerm: all
        BicTermUITests:
          - test
        BicTermTests:
          - test
    run:
      config: AppStore-Debug
    test:
      config: AppStore-Debug
      targets:
        - BicTermUITests
        - BicTermTests
    profile:
      config: AppStore-Release
    analyze:
      config: AppStore-Debug
    archive:
      config: AppStore-Release
