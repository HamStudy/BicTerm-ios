name: BicTerm
options:
  bundleIdPrefix: com.bicterm
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  BicTermCore:
    path: ./BicTermCore
  SwiftTerm:
    path: ./Vendor/SwiftTerm
targets:
  HerdrCoreC:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HerdrCoreC/include
        headerVisibility: public
      - path: HerdrCoreC/stub.c
    settings:
      base:
        PRODUCT_NAME: HerdrCore
        PRODUCT_MODULE_NAME: HerdrCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        # Pure clang-module host: no machine code of its own beyond the stub;
        # the real archive is the headerless HerdrCore.xcframework.
        MACH_O_TYPE: staticlib
  HerdrClientCore:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HerdrClientCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bicterm.HerdrClientCore
        PRODUCT_MODULE_NAME: HerdrClientCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Static archive: the HerdrCore C ABI resolves once in the app image.
        MACH_O_TYPE: staticlib
    dependencies:
      # Clang module for the ABI declarations; the machine code comes from
      # the headerless HerdrCore.xcframework below (see build-herdr-core.sh
      # for why it carries no headers).
      - target: HerdrCoreC
      - framework: .build-artifacts/herdr/HerdrCore.xcframework
        embed: false
  BicTerm:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BicTerm
      - path: Vendor/herdr/THIRD_PARTY_NOTICES.md
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bicterm.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: "0x0D1117"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # -u _herdr_client_create: the app target does not reference Herdr code
        # yet (T16 wires the UI); the anchor keeps the HerdrCore objects in
        # the app binary (Apache-2.0 is App Store-safe).
        OTHER_LDFLAGS: "$(inherited) -u _herdr_client_create"
    # iPadOS 26 windowing: the app must DECLARE all four interface
    # orientations (incl. upside-down portrait on iPad) to be classified as
    # continuously resizable; a missing/partial declaration falls back to
    # preset-snapping windows with scaled content (UIKit runtime fault:
    # "Support for all orientations will soon be required"). The ~ipad
    # variant cannot be expressed as an INFOPLIST_KEY_ build setting —
    # xcodebuild silently drops tilde-suffixed INFOPLIST_KEY names — so it
    # lives in this partial Info.plist, which GENERATE_INFOPLIST_FILE merges
    # with the INFOPLIST_KEY_* settings above.
    info:
      path: BicTerm/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: BicTermCore
        product: BicTermCore
      - package: SwiftTerm
        product: SwiftTerm
      # Static framework: link only, never embed (it merges into the app
      # binary; an embedded stub framework would be a bundle-validation bug).
      - target: HerdrClientCore
        embed: false
  HerdrClientCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HerdrClientCoreTests
      - path: Vendor/herdr/herdr-protocol/tests/fixtures/golden
        buildPhase: resources
        type: group
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: HerdrClientCore
  BicTermUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BicTermUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: BicTerm
  BicTermTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BicTermTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: BicTerm
schemes:
  BicTerm:
    build:
      targets:
        BicTerm: all
        BicTermUITests:
          - test
        BicTermTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BicTermUITests
        - BicTermTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  HerdrClientCore:
    build:
      targets:
        HerdrClientCore: all
        HerdrClientCoreTests:
          - test
    test:
      config: Debug
      targets:
        - HerdrClientCoreTests
